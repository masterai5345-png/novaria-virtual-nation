services:
  - type: web
    name: novaria-web
    runtime: node
    plan: starter
    branch: foundation/mvp
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_URL
        fromService:
          type: web
          name: novaria-web
          property: host
      - key: NEXT_PUBLIC_GOOGLE_AUTH_ENABLED
        value: "false"
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
      - key: NOVARIA_OWNER_EMAIL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OFFERWALL_ENABLED
        value: "false"

  - type: worker
    name: novaria-agent-worker
    runtime: node
    plan: starter
    branch: foundation/mvp
    buildCommand: npm install
    startCommand: npm run worker
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
      - key: WORKER_POLL_MS
        value: "5000"
