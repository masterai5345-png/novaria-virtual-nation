services:
  - type: web
    name: novaria-web
    runtime: node
    plan: starter
    region: singapore
    branch: foundation/mvp
    autoDeployTrigger: checksPass
    buildCommand: npm install --include=dev && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_GOOGLE_AUTH_ENABLED
        value: "false"
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
      - key: NOVARIA_OWNER_EMAIL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: novaria-db
          property: connectionString
      - key: AUDIENCE_INGEST_SECRET
        generateValue: true
      - key: SOCIAL_INGEST_SECRET
        generateValue: true
      - key: OFFERWALL_ENABLED
        value: "false"

  - type: worker
    name: novaria-agent-worker
    runtime: node
    plan: starter
    region: singapore
    branch: foundation/mvp
    autoDeployTrigger: checksPass
    buildCommand: npm install
    startCommand: npm run worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: novaria-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
      - key: WORKER_POLL_MS
        value: "5000"

  - type: cron
    name: novaria-daily-content-scheduler
    runtime: node
    plan: starter
    region: singapore
    branch: foundation/mvp
    schedule: "0 1 * * *"
    buildCommand: npm install
    startCommand: npm run enqueue:daily-content
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: novaria-db
          property: connectionString

databases:
  - name: novaria-db
    databaseName: novaria
    user: novaria
    plan: basic-256mb
    region: singapore
