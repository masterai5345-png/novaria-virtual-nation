});
function novariaPlayerTick(dt,t){
 if(!NOVARIA_PLAYER)return;
 var v=NOVARIA_PLAYER.position;
 var dx=(NOVARIA_WALK.right?1:0)-(NOVARIA_WALK.left?1:0);
 var dz=(NOVARIA_WALK.backward?1:0)-(NOVARIA_WALK.forward?1:0);
 var walking=(dx!==0||dz!==0)&&!NOVARIA_SITTING;
 if(walking){
   var d=Math.hypot(dx,dz);dx/=d;dz/=d;
   v.x=Math.max(-48,Math.min(48,v.x+dx*dt*4));
   v.z=Math.max(-48,Math.min(48,v.z+dz*dt*4));
   NOVARIA_PLAYER.rotation.y=Math.atan2(dx,dz);
 }
 v.y=NOVARIA_SITTING?.17:.4+(walking?Math.abs(Math.sin(t*12))*.11:0);
 NOVARIA_PLAYER.scale.y=NOVARIA_SITTING?.73:1;
 var ud=NOVARIA_PLAYER.userData;
 if(ud.lg&&ud.ar){
   var swing=walking?Math.sin(t*12)*.65:0;
   ud.lg[0].rotation.x=swing;ud.lg[1].rotation.x=-swing;
   ud.ar[0].rotation.x=-swing;ud.ar[1].rotation.x=swing;
   if(performance.now()<NOVARIA_WAVE_UNTIL)ud.ar[1].rotation.x=-1.5+Math.sin(t*18)*.4;
 }
}
